name: Lookers AI Visual QA
on:
  push:
    branches: [stage01-core-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Bilingual trends header and project-preservation checks
        run: node scripts/trends-header-qa.mjs
        env:
          TRENDS_QA_OUTPUT: visual-qa-artifacts/trends-header
      - run: node scripts/visual-qa.mjs
      - name: Real application user journeys (offline, no paid inference)
        run: node scripts/user-journeys.mjs
      - name: Universal tools and presentation user journeys (offline)
        run: npm run test:tool-journeys
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lookers-ai-real-screenshots
          path: visual-qa-artifacts/
          if-no-files-found: error
          retention-days: 14
