name: Lookers AI Stage 02 Validation

on:
  push:
    branches:
      - stage01-core-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Core tests
        run: npm run test:core
      - name: Brain tests
        run: npm run test:brain
      - name: Build
        run: npm run build
