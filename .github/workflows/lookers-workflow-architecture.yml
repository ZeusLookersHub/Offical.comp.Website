name: Workflow architecture contracts
on:
  push:
    branches: [feature/lookers-ai-workflow-architecture]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python docs/workflow-architecture-v2/validate.py
