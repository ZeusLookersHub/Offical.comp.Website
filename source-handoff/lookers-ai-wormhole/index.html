<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wormhole Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="lookers-motion.css">
<style>
/* Lookers AI interface on the locked Lookers Hub Motion Kit (motion files untouched).
   Layout: the site header and Lookers AI bar float over the galaxy; worlds orbit the wormhole eye,
   missions orbit the chosen world. Planets and asteroids are renders of the approved 3D look. */
:root{
  color-scheme:dark;
  --void:#05040c;          /* deep space, body colour from the kit */
  --ink:#f6efe2;           /* warm starlight */
  --mute:#b9b1c4;          /* violet-biased grey */
  --gold:#e3b866;          /* actions, numbers, selection */
  --gold-hi:#ffe4a6;
  --line:rgba(246,239,226,.15);
  --bar:rgba(12,14,20,.72);
  --f-display:"Cormorant Garamond","Times New Roman",Georgia,serif;  /* world and mission names */
  --f-ui:"Outfit","Almarai",system-ui,sans-serif;
  --f-ar:"Almarai","Outfit",system-ui,sans-serif;
  --head:136px;            /* height taken by the two header bars */
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
html[lang=ar] body{font-family:var(--f-ar)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:999px}

/* ---------- header: site bar + Lookers AI bar ---------- */
.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* main header: one slim row, three equal zones: logo | links (true centre) | language + Lookers AI */
.site{box-sizing:border-box;direction:ltr;position:relative;width:min(1240px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:60px;padding:0 12px 0 16px;
  border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(180deg,rgba(15,16,22,.86),rgba(8,9,13,.86));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35)}
.site::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(227,184,102,.6),transparent);opacity:.6;pointer-events:none;animation:site-glow 6s ease-in-out infinite}
@keyframes site-glow{50%{opacity:.2;left:34%;right:34%}}
.site .logo{justify-self:start}
.nav{display:flex;align-items:center;justify-content:center;gap:clamp(18px,2.2vw,32px);min-width:0}
html[dir=rtl] .nav{direction:rtl}
.nav button{position:relative;border:0;background:none;padding:10px 2px;font-size:13px;font-weight:500;letter-spacing:.01em;color:#d3cdc2;white-space:nowrap;transition:color .25s,transform var(--lh-dur-hover) var(--lh-ease-spring)}
html[lang=ar] .nav button{font-family:var(--f-ar);font-size:14px;font-weight:700;letter-spacing:0}
.nav button::after{content:"";position:absolute;left:50%;right:50%;bottom:4px;height:1.5px;border-radius:2px;background:var(--gold);transition:left .35s var(--lh-ease-out),right .35s var(--lh-ease-out)}
.nav button:hover{color:var(--gold-hi);transform:translateY(-1px)}
.nav button:hover::after{left:0;right:0}
.nav button:active{transform:scale(.95)}
.actions{justify-self:end;display:flex;align-items:center;gap:14px}
.pill{height:36px;border-radius:999px;border:1px solid var(--line);background:rgba(5,4,12,.45);display:inline-flex;align-items:center;gap:7px}
.pill:hover{border-color:var(--gold)}
.langsw{display:flex;align-items:center;gap:4px;height:36px;direction:ltr}
.langsw button{position:relative;border:0;background:none;padding:6px 5px;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#8e8a84;transition:color .25s,transform var(--lh-dur-hover) var(--lh-ease-spring)}
.langsw button[lang=ar]{font-family:var(--f-ar);font-size:13.5px;font-weight:700;letter-spacing:0}
.langsw button[aria-pressed=true]{color:var(--gold)}
.langsw button::after{content:"";position:absolute;left:25%;right:25%;bottom:1px;height:1.5px;border-radius:2px;background:var(--gold);transform:scaleX(0);transition:transform .35s var(--lh-ease-spring)}
.langsw button[aria-pressed=true]::after{transform:scaleX(1)}
.langsw button:hover{color:var(--gold-hi);transform:translateY(-1px)}
.langsw button:active{transform:scale(.92)}
.langsw i{width:1px;height:13px;background:rgba(255,255,255,.22)}
.ai{height:38px;padding:0 14px 0 12px;gap:8px;border-radius:12px;border:1px solid rgba(227,184,102,.55);background:rgba(227,184,102,.04);color:var(--gold-hi);font-size:13px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center}
.ai:hover{border-color:var(--gold);background:rgba(227,184,102,.1);box-shadow:0 0 22px rgba(227,184,102,.18)}
.ai-eye{width:18px;height:18px;flex:none;color:var(--gold)}
.ai-eye .pupil{animation:ai-look 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ai-eye .lid{transform-origin:12px 12px;animation:ai-blink 6s ease-in-out infinite}
.ai:hover .ai-eye .pupil{animation-duration:1.6s}
@keyframes ai-look{0%,40%,100%{transform:translate(0,0)}50%,62%{transform:translate(2.2px,-.6px)}72%,85%{transform:translate(-2px,.4px)}}
@keyframes ai-blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.ai .t-short{display:none}
.menu-btn{display:none;width:38px;height:38px;padding:0;justify-content:center;border-radius:12px}
.menu-btn svg{width:16px;height:16px}

.bar{box-sizing:border-box;width:min(660px,100%);display:flex;align-items:center;gap:6px;height:40px;padding:0 4px;border:1px solid rgba(121,205,211,.18);border-radius:999px;background:var(--bar);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bar-links{flex:1;min-width:0;display:flex;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.bar-links::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid transparent;background:none;font-size:12px;font-weight:500;color:#d8d5cf;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  transition:background .25s,border-color .25s,color .25s,transform var(--lh-dur-hover) var(--lh-ease-spring)}
.chip svg{width:12px;height:12px;opacity:.6;transition:transform .35s var(--lh-ease-spring)}
.chip:hover{color:var(--gold-hi);background:rgba(227,184,102,.08)}
.chip:hover svg{transform:translateY(2px)}
.chip:active{transform:scale(.95)}
.chip--edge{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.03)}
html[lang=ar] .chip{font-family:var(--f-ar)}

.drawer{position:fixed;z-index:25;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));
  display:grid;gap:2px;padding:8px;border-radius:20px;border:1px solid var(--line);background:rgba(10,10,18,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transform-origin:top;animation:drawer-in .45s var(--lh-ease-spring)}
.drawer button{text-align:start;border:0;background:none;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:600}
.drawer button:hover{background:rgba(227,184,102,.1);color:var(--gold-hi)}
@keyframes drawer-in{from{opacity:0;transform:scaleY(.85) translateY(-8px)}}

/* animated signature: approved L mark, wormhole eye, live wordmark flowing in and out of the eye */
.logo{display:flex;align-items:center;gap:8px;height:48px;color:var(--ink);text-decoration:none;border-radius:12px;perspective:420px;flex:none}
.logo-mark{position:relative;height:100%;aspect-ratio:300/349;flex:none;transition:transform .6s var(--lh-ease-out);filter:drop-shadow(0 0 8px rgba(240,160,64,.25))}
.logo-mark img{display:block;width:100%;height:100%}
.logo-sweep{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,247,224,.85) 50%,transparent 65%);mix-blend-mode:overlay;
  -webkit-mask:url(lookershub-mark.webp) center/contain no-repeat;mask:url(lookershub-mark.webp) center/contain no-repeat;transform:translateX(-140%);animation:logo-sweep 9s 1.6s ease-in-out infinite}
@keyframes logo-sweep{0%,82%{transform:translateX(-140%)}100%{transform:translateX(160%)}}
.logo-eye{position:absolute;left:82%;top:70.1%;width:24%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;transition:transform .3s}
.logo-eye::before{content:"";position:absolute;inset:-30%;border-radius:50%;background:conic-gradient(transparent 0 55%,rgba(255,207,122,.6) 70%,#fff2d0 74%,transparent 79%);
  -webkit-mask:radial-gradient(circle,transparent 52%,#000 57%,#000 68%,transparent 72%);mask:radial-gradient(circle,transparent 52%,#000 57%,#000 68%,transparent 72%);animation:lh-spin 4.5s linear infinite}
.logo:hover .logo-eye::before{animation-duration:1.2s}
.logo-eye::after{content:"";position:absolute;left:24%;top:20%;width:24%;height:24%;border-radius:50%;background:radial-gradient(circle,#fff,transparent 70%);animation:eye-glint 3.6s ease-in-out infinite}
@keyframes eye-glint{50%{translate:30% 15%;opacity:.5}}
.logo:hover .logo-mark{transform:rotateY(-14deg) rotateX(6deg) scale(1.04)}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-word{display:flex;font-family:"Outfit",system-ui,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.03em;white-space:nowrap}
.logo-word span{display:inline-block}
.logo-word .hub{background:linear-gradient(180deg,#ffe3a3,#e9b354 50%,#b97a2a);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-tag{margin-top:4px;font-family:"Outfit",system-ui,sans-serif;font-size:5.6px;font-weight:500;letter-spacing:.3em;color:#e9e4da;white-space:nowrap}

/* ---------- views ---------- */
.view{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
  padding-top:calc(var(--head) + 14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro{text-align:center;max-width:760px;position:relative;z-index:3;pointer-events:none}
.eyebrow{margin:0 0 8px;font-family:"Outfit",sans-serif;font-size:11px;font-weight:600;letter-spacing:.62em;text-indent:.62em;color:var(--gold)}
html[lang=ar] .eyebrow{font-family:var(--f-ar);letter-spacing:.08em;text-indent:0;font-size:12.5px}
.title{margin:0;font-family:var(--f-ui);font-weight:700;font-size:clamp(24px,2.8vw,38px);line-height:1.15;letter-spacing:-.025em;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.7)}
html[lang=ar] .title{font-family:var(--f-ar);font-weight:800;letter-spacing:0;line-height:1.4}
.sub{margin:8px auto 0;max-width:52ch;color:#d6cfc3;font-size:13.5px;line-height:1.6;letter-spacing:.06em}
html[lang=ar] .sub{letter-spacing:0;font-size:14px}
.stage{position:relative;flex:1;width:100%;max-width:1240px;min-height:0}

/* wormhole eye at the heart of the galaxy (vector, drawn from the logo's eye) */
.lh-core{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border:0;padding:0;background:none;z-index:2}
.lh-core .lh-sun{opacity:.55;filter:blur(6px)}
.wh{position:absolute;inset:0;pointer-events:none}
/* the wormhole eye (approved vector A): throat at 49.37% / 50.04% of the artwork sits on the core centre.
   Motion uses transforms and opacity only, so it stays light on phones. */
.wh-hov{position:absolute;left:50%;top:50%;width:300%;aspect-ratio:2/1;translate:-49.37% -50.04%;transform-origin:49.37% 50.04%;transition:transform .6s var(--lh-ease-spring)}
.wh-eye{position:absolute;inset:0;transform-origin:49.37% 50.04%;animation:wh-breathe 6.4s ease-in-out infinite}
.wh-out{position:absolute;inset:0;width:100%;height:100%;max-width:none;animation:wh-glow 6.4s ease-in-out infinite}
.wh-in{position:absolute;left:42.65%;top:36.58%;width:13.45%;height:auto;max-width:none;animation:wh-turn 26s linear infinite}
.wh-r{position:absolute;left:49.37%;top:50.04%;width:14%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:1px solid rgba(255,214,150,.6);opacity:0;animation:wh-fall 3s cubic-bezier(.5,0,.85,.45) infinite}
.wh-r:nth-child(4){animation-delay:-1s}.wh-r:nth-child(5){animation-delay:-2s}
@keyframes wh-breathe{0%,100%{transform:scale(1)}38%{transform:scale(1.035)}72%{transform:scale(.972)}}
@keyframes wh-glow{0%,100%{opacity:.92}38%{opacity:1}72%{opacity:.86}}
@keyframes wh-turn{to{transform:rotate(-360deg)}}
@keyframes wh-fall{0%{transform:scale(1);opacity:0}20%{opacity:.7}100%{transform:scale(.15);opacity:0}}
@media (max-width:640px){.wh-hov{width:240%}.lh-core .lh-sun{opacity:.3}}
.wh-gl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.wh:not(.wh--gl) .wh-gl{visibility:hidden}
.wh--gl .wh-eye{display:none}
/* golden spill from the wormhole on the facing side of each planet (set per frame; 0 when far) */
#homeStage .lh-planet:not(.lh-planet--slot) .lh-globe::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),rgba(255,196,118,var(--so,0)) 0,rgba(255,166,80,calc(var(--so,0) * .55)) 26%,transparent 56%)}
.lh-core:hover .wh-hov{transform:scale(1.06)}
.lh-core:active .wh-hov{transform:scale(.95)}
.wh-dust{position:absolute;left:50%;top:50%;width:0;height:0}
.wh-dust i{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:#ffe2a4;box-shadow:0 0 8px 2px rgba(255,196,110,.8);
  animation:wh-in var(--d,3.4s) cubic-bezier(.5,0,.85,.4) infinite;animation-delay:var(--w,0s)}
@keyframes wh-in{0%{transform:rotate(var(--a)) translateX(92px) scale(1);opacity:0}15%{opacity:1}100%{transform:rotate(calc(var(--a) + 330deg)) translateX(10px) scale(.15);opacity:0}}
.lh-core:hover .wh-dust i{animation-duration:1.5s}
.core-name{position:absolute;left:50%;top:calc(100% + 22px);translate:-50% 0;white-space:nowrap;font-family:"Outfit",sans-serif;font-size:10px;font-weight:600;letter-spacing:.42em;color:var(--gold);opacity:.9}

/* worlds: 3D renders on the kit's planet; rings in two halves so they pass behind and in front */
.lh-planet{gap:10px}
.lh-globe{isolation:isolate}
.lh-surface{background-size:100% 100%!important;box-shadow:0 0 34px -6px var(--glow)}
.lh-surface::after{background:radial-gradient(circle at 75% 80%,rgba(0,0,0,.25),transparent 55%)}
.pl-ring{position:absolute;left:50%;top:50%;width:calc(var(--rs) * 100%);height:calc(var(--rs) * 100%);translate:-50% -50%;pointer-events:none;
  transition:transform .6s var(--lh-ease-spring)}
.pl-ring--back{z-index:-1}
.pl-ring--front{z-index:2}
.lh-planet:hover .pl-ring{transform:rotate(-4deg) scale(1.04)}
.lh-moon{z-index:3}
.pl-text{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;text-shadow:0 2px 10px #000,0 0 24px rgba(0,0,0,.85);pointer-events:none}
.pl-num{font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.2em;color:var(--gold)}
.pl-name{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,1.7vw,25px);line-height:1;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:#fffaf0;transition:color .3s,letter-spacing .5s var(--lh-ease-out)}
html[lang=ar] .pl-name{font-family:var(--f-ar);font-weight:800;letter-spacing:0;text-transform:none;font-size:clamp(17px,1.6vw,22px)}
.pl-sub{font-size:9.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#ece0cc;white-space:nowrap}
html[lang=ar] .pl-sub{letter-spacing:0;font-size:12px;font-weight:400}
.pl-line{width:22px;height:2px;margin-top:5px;border-radius:2px;background:var(--gold);box-shadow:0 0 8px rgba(227,184,102,.6);transition:width .45s var(--lh-ease-spring)}
.lh-planet:hover .pl-name,.lh-planet:focus-visible .pl-name{color:var(--gold-hi);letter-spacing:.1em}
html[lang=ar] .lh-planet:hover .pl-name{letter-spacing:0}
.lh-planet:hover .pl-line,.lh-planet:focus-visible .pl-line{width:48px}
.lh-hint{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.06em}
.lh-planet:focus-visible{outline:none}
.lh-planet:focus-visible .lh-globe{outline:2px solid var(--gold);outline-offset:8px;border-radius:50%}
.lh-planet--slot .pl-name{font-family:var(--f-ui);font-size:10.5px;font-weight:500;letter-spacing:.14em;color:var(--mute)}
html[lang=ar] .lh-planet--slot .pl-name{font-family:var(--f-ar);font-size:12px;font-weight:400}

/* missions: artistic asteroids that tumble slowly; the chosen world sits at the centre */
.pl-rock{position:absolute;left:50%;top:50%;width:150%;height:150%;translate:-50% -50%;pointer-events:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));animation:rock-tumble 11s ease-in-out infinite}
.lh-planet:nth-child(odd) .pl-rock{animation-duration:14s;animation-direction:reverse}
@keyframes rock-tumble{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(9deg) translateY(-5px)}}
.lh-planet--rock:hover .pl-rock{filter:drop-shadow(0 10px 14px rgba(0,0,0,.6)) drop-shadow(0 0 14px var(--glow)) brightness(1.2)}
.ms-desc{max-width:160px;font-size:11.5px;line-height:1.4;color:#cfc8bc;white-space:normal}
.focus{position:absolute;left:50%;top:50%;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;translate:-50% calc(var(--fs) * -.5);pointer-events:none;animation:lh-pop 1s var(--lh-ease-spring) both}
.focus .lh-globe{animation:focus-float 6s ease-in-out infinite}
@keyframes focus-float{50%{translate:0 -6px}}
.focus .pl-name{font-size:clamp(24px,2.4vw,34px);letter-spacing:.16em}
html[lang=ar] .focus .pl-name{letter-spacing:0;font-size:clamp(22px,2.2vw,30px)}

.back{position:absolute;z-index:6;top:calc(var(--head) + 14px + env(safe-area-inset-top,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));height:40px;padding:0 15px;font-size:13.5px;font-weight:600}
.back svg{width:16px;height:16px}
html[dir=rtl] .back svg{transform:scaleX(-1)}

.lh-toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:40;padding:10px 18px;border-radius:999px;background:rgba(10,8,20,.9);border:1px solid var(--line);font-size:14px;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:1240px){.nav button{font-size:12.5px}.actions{gap:10px}}
@media (max-width:1100px){
  :root{--head:116px}
  .nav{display:none}
  .menu-btn{display:inline-flex}
  .site{height:56px;grid-template-columns:auto 1fr}
  .actions{gap:10px}
  .bar-links{justify-content:flex-start}
}
@media (max-width:640px){
  :root{--head:110px}
  .site{width:100%;grid-template-columns:minmax(0,1fr) auto;height:54px;padding:0 8px 0 10px;gap:6px;border-radius:16px}
  .bar{width:100%}
  .actions{gap:6px}
  .site .logo{min-width:0}
  .logo{height:40px}
  .logo-word{font-size:16px}.logo-tag{font-size:4.8px}
  .ai .t{display:none}.ai .t-short{display:inline}.ai{padding:0 10px;gap:6px}
  .langsw{gap:2px}.langsw button{padding:6px 3px}
  .bar .chip--edge:last-child{display:none}
  .eyebrow{font-size:10px;letter-spacing:.5em;margin-bottom:6px}
  .title{font-size:23px}
  .sub{font-size:12px;letter-spacing:.02em}
  .lh-core{width:84px;height:84px;margin:-42px 0 0 -42px}
  .core-name{display:none}
  .pl-sub,.lh-hint,.ms-desc{display:none}
  .pl-num{font-size:11px}
  .pl-name{font-size:12.5px;letter-spacing:.03em}
  html[lang=ar] .pl-name{font-size:13.5px}
  .pl-line{width:16px;margin-top:3px}

<script>
/* Live updates: the viewer may re-run this script inside a page that is already open.

function lhBoot(){
/* ============ CONTENT ============ */
/* Order around the orbit (clockwise from the top) mirrors the reference: Design on top,

const WORLDS = [
  { id:'design', num:'01', en:'Design', ar:'التصميم', subEn:'Visuals & Branding', subAr:'المرئيات والهوية', glow:'rgba(255,170,80,.8)', ring:2.132,
    tasks:[['Brand Identity','الهوية البصرية','Logo, colours and brand voice','لوجو وألوان وصوت البراند'],['UI / UX','تصميم الواجهات','Screens and user journeys','شاشات ورحلة المستخدم'],['Social Design','تصميم السوشيال','Posts, stories and covers','بوستات وستوريز وأغلفة'],['Motion Design','الموشن','Animated logos and short videos','لوجو متحرك وفيديوهات قصيرة']] },
  { id:'business', num:'03', en:'Business', ar:'الأعمال', subEn:'Plans & Growth', subAr:'خطط ونمو', glow:'rgba(233,195,138,.6)', ring:2.236,
    tasks:[['Business Plan','خطة عمل','Model, costs and growth','النموذج والتكاليف والنمو'],['Company Profile','ملف شركة','Who you are, page by page','تعريف شركتك صفحة بصفحة'],['Pitch Deck','عرض استثماري','The story investors hear','القصة اللي هيسمعها المستثمر'],['Strategy','استراتيجية','Goals, priorities and next moves','أهداف وأولويات وخطوات جاية']] },
  { id:'technology', num:'05', en:'Technology', ar:'التكنولوجيا', subEn:'Web, Apps & AI', subAr:'ويب وتطبيقات وذكاء اصطناعي', glow:'rgba(90,230,200,.7)', ring:2.028,
    tasks:[['Website','موقع إلكتروني','Pages, sections and copy','صفحات وأقسام ونصوص'],['Mobile App','تطبيق موبايل','Features and screens','مميزات وشاشات'],['AI Agent','وكيل ذكاء اصطناعي','What it does and how it decides','بيعمل إيه وبيقرر إزاي'],['Automation','أتمتة','Workflows that run themselves','خطوات شغل بتمشي لوحدها']] },
  { id:'presentations', num:'04', en:'Presentations', ar:'العروض التقديمية', subEn:'Ideas that Impact', subAr:'أفكار تترك أثر', glow:'rgba(185,140,255,.75)', ring:2.392,
    tasks:[['Pitch Deck','عرض استثماري','Slide by slide, ready to present','شريحة بشريحة وجاهز للعرض'],['Business Review','مراجعة أعمال','Results, numbers and lessons','نتايج وأرقام ودروس'],['Training Slides','شرائح تدريبية','Lessons your team can follow','دروس يقدر فريقك يتابعها'],['Product Launch','إطلاق منتج','Announce it with impact','أعلن عن منتجك بقوة']] },
  { id:'marketing', num:'02', en:'Marketing', ar:'التسويق', subEn:'Ideas to Audiences', subAr:'من الفكرة للجمهور', glow:'rgba(90,170,255,.75)', ring:1.82,
    tasks:[['Campaign','حملة إعلانية','Ad idea, copy and channels','فكرة الإعلان والنصوص والقنوات'],['Content Strategy','استراتيجية المحتوى','A month of planned content','خطة محتوى لشهر كامل'],['Social Media','السوشيال ميديا','Captions, hooks and a posting plan','كابشن وهوكس وجدول نشر'],['Market Research','أبحاث السوق','Audience, competitors and gaps','الجمهور والمنافسين والفرص']] },
];
/* Reserved inner-orbit places for future worlds. */
const SLOTS = 3;
const ROCK_GLOWS = ['rgba(255,197,110,.75)','rgba(127,227,210,.7)','rgba(255,143,184,.7)','rgba(159,179,255,.7)'];
const BANDS = 'repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 3%,transparent 3% 12%,rgba(0,0,0,.14) 12% 16%,transparent 16% 28%)';

const NAV = [['Home','الرئيسية','/'],['Services','الخدمات','/services'],['Projects','المشاريع','/projects'],['About','من نحن','/about'],['Contact','تواصل معنا','/contact'],['Start your project','ابدأ مشروعك','/start-your-project']];
const BAR = [['Images','صور'],['Videos','فيديو'],['Social','سوشيال'],['Prompts','برومبت'],['Explore','استكشف']];

const T = {
  en:{ title:'One idea. [Every] [step] [opens] [the] [next.]', sub:'Explore your universe. Turn ideas into real results.',
       enter:'Enter', soon:'Coming soon', soonToast:'This orbit is saved for a new world', back:'All worlds',
       stepsEyebrow:'CHOOSE YOUR MISSION', stepsTitle:'What do you want to [create?]',
       pickToast:'Next: the conversation for ', library:'Prompt Library', tools:'AI tools',
       linkToast:'This opens on the LookersHub website', langLabel:'ع', langAria:'التبديل للعربية', aiHome:'You are in Lookers AI' },
  ar:{ title:'فكرة واحدة. [وكل] [خطوة] [تفتح] [اللي] [بعدها.]', sub:'استكشف عالمك، وحوّل أفكارك لنتائج حقيقية.',
       enter:'ادخل', soon:'قريبًا', soonToast:'المدار ده محجوز لعالم جديد', back:'كل العوالم',
       stepsEyebrow:'اختار مهمتك', stepsTitle:'عايز [تعمل] [إيه؟]',
       pickToast:'الخطوة الجاية: المحادثة لـ ', library:'مكتبة البرومبت', tools:'أدوات AI',
       linkToast:'الصفحة دي بتفتح على موقع LookersHub', langLabel:'EN', langAria:'Switch to English', aiHome:'إنت جوه Lookers AI' },
};
/* ================================== */

const M = LookersMotion.init({ rockSprites: [0,1,2,3,4,5,6,7].map(i => ({ src:`space/asteroid-${i}.webp`, pal:Math.floor(i / 2) })) });
const $ = s => document.querySelector(s);
let lang = 'ar', current = null, homeOrbit = null, stepOrbit = null;
try { lang = localStorage.getItem('lh-lang') || 'ar'; } catch (e) {}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arrow = () => lang === 'ar' ? '←' : '→';

/* --- wormhole: particles pulled into the throat --- */
(function buildDust(){
  const dust = $('#whDust');
  dust.textContent = '';
  for (let i = 0; i < 12; i++) {
    const d = document.createElement('i');
    d.style.setProperty('--a', (i * 30) + 'deg'); d.style.setProperty('--w', (-i * .29).toFixed(2) + 's'); d.style.setProperty('--d', (3 + (i % 3) * .5) + 's');
    dust.appendChild(d);
  }
})();

function planetEl({ w, size, num, name, sub, desc, slot, rock, i }){
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'lh-planet lh-pop' + (slot ? ' lh-planet--slot' : '') + (rock != null ? ' lh-planet--rock' : '');
  el.style.setProperty('--i', i);
  if (slot) {
    el.innerHTML = `<span class="lh-globe" style="--s:${size}px"></span><span class="pl-text"><span class="pl-name">${esc(T[lang].soon)}</span></span>`;
    el.setAttribute('aria-label', T[lang].soon);
    return el;
  }
  let globe;
  if (rock != null) {
    globe = `<span class="lh-globe" style="--s:${size}px;--glow:${ROCK_GLOWS[rock]}"><img class="pl-rock" src="space/rock-${rock}.webp" alt=""></span>`;
  } else {
    globe = `<span class="lh-globe" style="--s:${size}px;--rs:${w.ring};--base:url(space/${w.id}-sphere.webp) center/100% 100% no-repeat;--bands:${BANDS};--glow:${w.glow};--spin:${22 + i * 3}s">`
      + `<img class="pl-ring pl-ring--back" src="space/${w.id}-ring-back.webp" alt=""><span class="lh-atmo"></span><span class="lh-surface"></span><img class="pl-ring pl-ring--front" src="space/${w.id}-ring-front.webp" alt=""></span>`;
  }
  el.innerHTML = globe + `<span class="pl-text">${num ? `<span class="pl-num">${num}</span>` : ''}<span class="pl-name">${esc(name)}</span>${sub ? `<span class="pl-sub">${esc(sub)}</span>` : ''}${desc ? `<span class="ms-desc">${esc(desc)}</span>` : ''}<span class="pl-line"></span><span class="lh-hint">${esc(T[lang].enter)} ${arrow()}</span></span>`;
  el.setAttribute('aria-label', [name, sub || desc].filter(Boolean).join(', '));
  return el;
}

function buildHome(){
  const stage = $('#homeStage');
  homeOrbit && homeOrbit.destroy(); stage.querySelectorAll('.lh-planet').forEach(n => n.remove());
  const r = stage.getBoundingClientRect(), small = r.width < 640;
  const big = small ? Math.max(60, Math.min(r.width * .17, 76)) : Math.round(Math.min(118, Math.max(84, r.height * .17)));
  const items = [];
  WORLDS.forEach((w, i) => {
    const el = planetEl({ w, size:big, num:w.num, name:w[lang], sub:lang === 'ar' ? w.subAr : w.subEn, i });
    stage.appendChild(el);
    el.addEventListener('click', () => openWorld(w, el));
    items.push({ el, ring:'outer', size:big });
  });
  for (let s = 0; s < SLOTS; s++) {
    const sz = Math.round(big * .4), el = planetEl({ size:sz, slot:true, i:WORLDS.length + s });
    stage.appendChild(el);
    el.addEventListener('click', () => toast(T[lang].soonToast));
    items.push({ el, ring:'inner', size:sz });
  }
  homeOrbit = M.orbit(stage, items, small
    ? { outer:[.36,.37], inner:[.58,.5], maxRy:300 }
    : { outer:[.42,.33], maxRx:540, maxRy:Math.max(180, r.height * .33), inner:[.5,.52] });
}

function buildMissions(w){
  const stage = $('#stepStage');
  stepOrbit && stepOrbit.destroy(); stage.querySelectorAll('.lh-planet,.focus').forEach(n => n.remove());
  const r = stage.getBoundingClientRect(), width = r.width || innerWidth, small = width < 640;
  const fsize = small ? 78 : Math.round(Math.min(124, Math.max(96, (r.height || 500) * .19)));
  const focus = document.createElement('div');
  focus.className = 'focus';
  focus.style.setProperty('--fs', fsize + 'px');
  focus.innerHTML = `<span class="lh-globe" style="--s:${fsize}px;--rs:${w.ring};--base:url(space/${w.id}-sphere.webp) center/100% 100% no-repeat;--bands:${BANDS};--glow:${w.glow};--spin:24s">`
    + `<img class="pl-ring pl-ring--back" src="space/${w.id}-ring-back.webp" alt=""><span class="lh-atmo"></span><span class="lh-surface"></span><img class="pl-ring pl-ring--front" src="space/${w.id}-ring-front.webp" alt=""></span>`
    + `<span class="pl-text"><span class="pl-num">${w.num}</span><span class="pl-name">${esc(w[lang])}</span><span class="pl-sub">${esc(lang === 'ar' ? w.subAr : w.subEn)}</span></span>`;
  stage.appendChild(focus);
  $('#stepsEyebrow').textContent = `${w.num} · ${lang === 'ar' ? w.ar : w.en.toUpperCase()}`;
  const size = small ? Math.max(50, Math.min(width * .14, 60)) : Math.min(88, Math.max(70, width * .06));
  const items = w.tasks.map((t, i) => {
    const el = planetEl({ size, rock:i, num:String(i + 1).padStart(2, '0'), name:lang === 'ar' ? t[1] : t[0], desc:lang === 'ar' ? t[3] : t[2], i });
    stage.appendChild(el);
    el.addEventListener('click', () => { M.burst(el); toast(T[lang].pickToast + (lang === 'ar' ? t[1] : t[0])); });
    return { el, ring:'outer', size };
  });
  stepOrbit = M.orbit(stage, items, small ? { outer:[.36,.4], maxRy:250, speed:.0012 } : { maxRx:540, maxRy:Math.max(190, (r.height || 500) * .37), outer:[.44,.4], speed:.0012 });
}

function openWorld(w, el){
  current = w;
  M.burst(el); M.warp(1);
  const steps = $('#steps'); steps.hidden = false; buildMissions(w);
  requestAnimationFrame(() => { $('#home').classList.add('is-away'); steps.classList.remove('is-behind'); homeOrbit.pause(true); });
  setTimeout(() => $('#back').focus({ preventScroll:true }), 700);
}
function closeWorld(){
  if (!current) return;
  M.warp(-1); homeOrbit.pause(false);
  $('#steps').classList.add('is-behind'); $('#home').classList.remove('is-away');
  setTimeout(() => { $('#steps').hidden = true; current = null; }, 800);
}

/* --- header --- */
const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function buildHeader(){
  const t = T[lang], i = lang === 'ar' ? 1 : 0;
  $('#nav').innerHTML = NAV.map(n => `<button type="button" class="lh-lift" data-path="${n[2]}">${esc(n[i])}</button>`).join('');
  $('#bar').innerHTML = `<button type="button" class="chip chip--edge lh-lift">${esc(t.library)}</button><div class="bar-links">${BAR.map(b => `<button type="button" class="chip">${esc(b[i])}${chev}</button>`).join('')}</div><button type="button" class="chip chip--edge lh-lift">${esc(t.tools)}</button>`;
  $('#drawer').innerHTML = NAV.map(n => `<button type="button" data-path="${n[2]}">${esc(n[i])}</button>`).join('');
  document.querySelectorAll('#nav button,#bar button,#drawer button').forEach(b => b.addEventListener('click', () => { toast(t.linkToast); closeDrawer(); }));
}
function closeDrawer(){ $('#drawer').hidden = true; $('#menuBtn').setAttribute('aria-expanded', 'false'); }
$('#menuBtn').addEventListener('click', () => { const d = $('#drawer'); d.hidden = !d.hidden; $('#menuBtn').setAttribute('aria-expanded', String(!d.hidden)); });
document.addEventListener('pointerdown', e => { if (!$('#drawer').hidden && !e.target.closest('#drawer,#menuBtn')) closeDrawer(); });

/* --- animated wordmark: letters flow out of the eye, and every few seconds back in and out again --- */
const WORD = 'LookersHub';
WORD.split('').forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; if (i >= 7) s.className = 'hub'; $('#logoWord').appendChild(s); });
function flowLetters(inward){
  if (M.reduced) return;
  const spans = [...document.querySelectorAll('#logoWord span')];
  if (!spans.length || !spans[0].offsetParent) return;
  const e = $('#logoEye').getBoundingClientRect();
  spans.forEach((s, i) => {
    const r = s.getBoundingClientRect(), x = e.left + e.width / 2 - (r.left + r.width / 2), y = e.top + e.height / 2 - (r.top + r.height / 2);
    const away = { transform:`translate(${x}px,${y}px) scale(.1)`, opacity:0, filter:'blur(3px)' }, home = { transform:'none', opacity:1, filter:'blur(0)' };
    s.animate(inward ? [home, away] : [away, home], { duration:inward ? 650 : 900, delay:i * (inward ? 40 : 55), easing:inward ? 'cubic-bezier(.55,0,.8,.2)' : 'cubic-bezier(.16,1,.3,1)', fill:'both' });
  });
  $('#logoEye').animate([{ scale:1 }, { scale:inward ? 1.35 : .8 }, { scale:1 }], { duration:inward ? 900 : 700, easing:'ease-out' });
}
requestAnimationFrame(() => flowLetters(false));
if (!M.reduced) window.__lhLogoTimer = setInterval(() => { if (document.hidden) return; flowLetters(true); setTimeout(() => flowLetters(false), 1050); }, 9000);
const logo = $('#logo');
logo.addEventListener('pointermove', e => { const r = logo.getBoundingClientRect(); $('#logoEye').style.transform = `translate(${((e.clientX - r.left) / r.width - .5) * 4}px,${((e.clientY - r.top) / r.height - .5) * 4}px)`; });
logo.addEventListener('pointerleave', () => { $('#logoEye').style.transform = ''; });
logo.addEventListener('pointerenter', () => {
  if (M.reduced) return;
  document.querySelectorAll('#logoWord span').forEach((s, i) => s.animate([{ translate:'0 0' }, { translate:'0 -3px' }, { translate:'0 0' }], { duration:420, delay:i * 30, easing:'ease-out' }));
});

function applyLang(){
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll('[data-split]').forEach(el => M.splitWords(el, t[el.dataset.split]));
  document.querySelectorAll('#langsw button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('#langsw').setAttribute('aria-label', lang === 'ar' ? 'اللغة' : 'Language');
  $('#menuBtn').setAttribute('aria-label', lang === 'ar' ? 'القائمة' : 'Menu');
  buildHeader(); buildHome(); if (current) buildMissions(current);
}

let toastTimer;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('is-shown'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('is-shown'), 2400); }

$('#back').addEventListener('click', closeWorld);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); closeWorld(); } });
document.querySelectorAll('#langsw button').forEach(b => b.addEventListener('click', () => { if (b.dataset.lang === lang) return; lang = b.dataset.lang; try { localStorage.setItem('lh-lang', lang); } catch (e) {} applyLang(); }));
$('#ai').addEventListener('click', () => { if (current) closeWorld(); else { M.burst($('#core'), 50); toast(T[lang].aiHome); } });
$('#core').addEventListener('click', () => M.burst($('#core'), 60));
logo.addEventListener('click', e => { e.preventDefault(); closeWorld(); });
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { buildHome(); if (current) buildMissions(current); }, 150); });
applyLang();
startWormhole();
}
/* --- wormhole: WebGL flow over the approved artwork ---
   One small canvas the size of the eye. The silhouette and the dark core come from the static artwork;
   inside it, two flows run at once: the inner layers spiral and contract into the throat, the outer layers
   release slow ripples and filaments that drift outward and fade. Grading (dodge & burn, exposure, warmth)
   is matched to the planets, and the key light comes from the upper right like the rest of the scene. */
function startWormhole(){
  if (window.__whStop) window.__whStop();
  const host = document.querySelector('.wh-hov'), cv = document.querySelector('.wh-gl');
  if (!host || !cv) return;
  const gl = cv.getContext('webgl', { premultipliedAlpha:true, alpha:true, antialias:false });
  if (!gl) return;                                   // keeps the SVG eye
  const VS = 'attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;v.y=1.-v.y;gl_Position=vec4(p,0.,1.);}';
  const FS = `precision mediump float;
uniform sampler2D T;uniform float t,mo;uniform vec2 C;varying vec2 v;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
